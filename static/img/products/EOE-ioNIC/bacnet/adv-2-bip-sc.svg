<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>BACnet/IP and BACnet/SC in one module: one setting, AT+BACMODE, chooses BACnet/IP on the site LAN or BACnet/SC over TLS through a hub</title>
  <rect width="720" height="360" fill="#ffffff"/>

  <!-- Module with the mode selector -->
  <rect x="226" y="22" width="268" height="132" rx="14" fill="#e9f9f5" stroke="#25c2a0" stroke-width="2.5"/>
  <text x="360" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1a8870">EOE-W55RP20_BACnet</text>
  <rect x="256" y="70" width="208" height="38" rx="19" fill="#ffffff" stroke="#25c2a0" stroke-width="1.5"/>
  <rect x="256" y="70" width="104" height="38" rx="19" fill="#25c2a0"/>
  <rect x="320" y="70" width="40" height="38" fill="#25c2a0"/>
  <text x="308" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">BACnet/IP</text>
  <text x="412" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#1a8870">BACnet/SC</text>
  <text x="360" y="138" text-anchor="middle" font-size="13" fill="#52606d">one setting: <tspan font-weight="700" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#1f2933">AT+BACMODE</tspan></text>

  <!-- The two ways out -->
  <path d="M360 154V178M150 178H570M150 178V204M570 178V204" fill="none" stroke="#52606d" stroke-width="2"/>

  <!-- BACnet/IP: workstation on the site LAN -->
  <rect x="40" y="204" width="220" height="130" rx="12" fill="#f6f8fa" stroke="#cdd5dd" stroke-width="1.5"/>
  <rect x="124" y="220" width="52" height="34" rx="3" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
  <polyline points="132,246 142,238 150,242 160,230 168,234" fill="none" stroke="#25c2a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M150 254v8M138 262h24" stroke="#52606d" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">BACnet/IP</text>
  <text x="150" y="314" text-anchor="middle" font-size="13" fill="#52606d">UDP 47808 on the site LAN</text>

  <!-- BACnet/SC: a hub, over TLS -->
  <rect x="460" y="204" width="220" height="130" rx="12" fill="#f6f8fa" stroke="#cdd5dd" stroke-width="1.5"/>
  <line x1="570" y1="240" x2="532" y2="228" stroke="#b8c2cc" stroke-width="2"/>
  <line x1="570" y1="240" x2="608" y2="228" stroke="#b8c2cc" stroke-width="2"/>
  <line x1="570" y1="240" x2="570" y2="266" stroke="#b8c2cc" stroke-width="2"/>
  <circle cx="532" cy="228" r="6" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
  <circle cx="608" cy="228" r="6" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
  <circle cx="570" cy="266" r="6" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
  <circle cx="570" cy="240" r="18" fill="#ffffff" stroke="#25c2a0" stroke-width="2.5"/>
  <path d="M564 238v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#1a8870" stroke-width="2"/>
  <rect x="561" y="237" width="18" height="13" rx="2" fill="#25c2a0"/>
  <text x="570" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">BACnet/SC</text>
  <text x="570" y="314" text-anchor="middle" font-size="13" fill="#52606d">TLS 1.3 through a hub</text>
</svg>
