<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Safe factory defaults: out of the box BACnet and the web interface are off, so nothing is announced on the network until the module is configured, and a factory reset erases the BACnet/SC private key first</title>
  <rect width="720" height="360" fill="#ffffff"/>

  <!-- The module out of the box -->
  <rect x="36" y="36" width="320" height="288" rx="14" fill="#e9f9f5" stroke="#25c2a0" stroke-width="2.5"/>
  <text x="196" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#1a8870">Out of the box</text>

  <rect x="60" y="88" width="272" height="56" rx="10" fill="#ffffff" stroke="#cdd5dd" stroke-width="1.5"/>
  <text x="80" y="122" font-size="16" font-weight="700" fill="#1f2933">BACnet</text>
  <text x="250" y="121" text-anchor="end" font-size="13" font-weight="700" fill="#52606d">OFF</text>
  <rect x="262" y="104" width="48" height="24" rx="12" fill="#cdd5dd"/>
  <circle cx="274" cy="116" r="9" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/>

  <rect x="60" y="156" width="272" height="56" rx="10" fill="#ffffff" stroke="#cdd5dd" stroke-width="1.5"/>
  <text x="80" y="190" font-size="16" font-weight="700" fill="#1f2933">Web interface</text>
  <text x="250" y="189" text-anchor="end" font-size="13" font-weight="700" fill="#52606d">OFF</text>
  <rect x="262" y="172" width="48" height="24" rx="12" fill="#cdd5dd"/>
  <circle cx="274" cy="184" r="9" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/>

  <rect x="60" y="224" width="272" height="76" rx="10" fill="#ffffff" stroke="#cdd5dd" stroke-width="1.5"/>
  <circle cx="88" cy="262" r="9" fill="none" stroke="#1a8870" stroke-width="2.5"/>
  <path d="M97 262h22M112 262v7M118 262v5" fill="none" stroke="#1a8870" stroke-width="2.5" stroke-linecap="round"/>
  <text x="132" y="256" font-size="15" font-weight="600" fill="#1f2933">Factory reset</text>
  <text x="132" y="278" font-size="13" fill="#52606d">erases the SC private key first</text>

  <!-- Nothing reaches the network -->
  <line x1="356" y1="180" x2="470" y2="180" stroke="#cdd5dd" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="413" cy="180" r="15" fill="#ffffff" stroke="#e5484d" stroke-width="2.5"/>
  <line x1="402" y1="191" x2="424" y2="169" stroke="#e5484d" stroke-width="2.5"/>

  <rect x="470" y="98" width="214" height="164" rx="12" fill="#f6f8fa" stroke="#cdd5dd" stroke-width="1.5"/>
  <rect x="551" y="118" width="52" height="34" rx="3" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
  <line x1="559" y1="138" x2="595" y2="138" stroke="#b8c2cc" stroke-width="2" stroke-linecap="round"/>
  <path d="M577 152v8M565 160h24" stroke="#52606d" stroke-width="2" stroke-linecap="round"/>
  <text x="577" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Nothing announced</text>
  <text x="577" y="214" text-anchor="middle" font-size="13" fill="#52606d">no I-Am, no web server</text>
  <text x="577" y="234" text-anchor="middle" font-size="13" fill="#52606d">until you turn them on</text>
</svg>
