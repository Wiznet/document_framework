<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>A lighter host MCU. Without the module, your MCU carries the BACnet stack, TLS, the TCP/IP stack and the Ethernet driver. With the module, your MCU keeps only its application and sends values over UART; the module carries every layer.</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a8870"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#ffffff"/>

  <!-- Two halves on different grounds -->
  <rect x="10" y="10" width="344" height="340" rx="16" fill="#fff8ee"/>
  <rect x="366" y="10" width="344" height="340" rx="16" fill="#ebfaf5"/>

  <!-- Without the module -->
  <rect x="86" y="20" width="200" height="30" rx="15" fill="#ffe2b3" stroke="#f0b45a" stroke-width="1.5"/>
  <path d="M102 30l10 10M112 30l-10 10" stroke="#b25e00" stroke-width="2.5" stroke-linecap="round"/>
  <text x="122" y="41" font-size="15" font-weight="700" fill="#8a5300">Without the module</text>

  <rect x="40" y="60" width="290" height="270" rx="14" fill="#ffffff" stroke="#f0b45a" stroke-width="2"/>
  <text x="185" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">Your MCU</text>
  <rect x="62" y="102" width="246" height="36" rx="8" fill="#ffffff" stroke="#cdd5dd" stroke-width="1.5"/>
  <text x="185" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Your application</text>
  <rect x="62" y="146" width="246" height="36" rx="8" fill="#fff4e5" stroke="#f0b45a" stroke-width="1.5"/>
  <text x="185" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">BACnet stack</text>
  <rect x="62" y="190" width="246" height="36" rx="8" fill="#fff4e5" stroke="#f0b45a" stroke-width="1.5"/>
  <text x="185" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">TLS 1.3 · certificates</text>
  <rect x="62" y="234" width="246" height="36" rx="8" fill="#fff4e5" stroke="#f0b45a" stroke-width="1.5"/>
  <text x="185" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">TCP/IP stack</text>
  <rect x="62" y="278" width="246" height="36" rx="8" fill="#fff4e5" stroke="#f0b45a" stroke-width="1.5"/>
  <text x="185" y="301" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">Ethernet driver</text>

  <!-- The burden moves into the module -->
  <path d="M312 230C344 230 360 256 391 256" fill="none" stroke="#1a8870" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a1)"/>

  <!-- With the module -->
  <rect x="456" y="20" width="168" height="30" rx="15" fill="#25c2a0"/>
  <path d="M470 35l5 5l9-10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="492" y="41" font-size="15" font-weight="700" fill="#ffffff">With the module</text>

  <rect x="430" y="60" width="220" height="62" rx="12" fill="#ffffff" stroke="#cdd5dd" stroke-width="1.5"/>
  <text x="540" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">Your MCU</text>
  <text x="540" y="108" text-anchor="middle" font-size="13" fill="#52606d">your application only</text>

  <line x1="540" y1="122" x2="540" y2="176" stroke="#52606d" stroke-width="2"/>
  <rect x="552" y="137" width="62" height="24" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
  <text x="583" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">UART</text>
  <text x="530" y="154" text-anchor="end" font-size="13" font-weight="600" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#1f2933">AT+BOBJVAL=AI,1,21.5</text>

  <rect x="394" y="176" width="292" height="158" rx="14" fill="#ffffff" stroke="#25c2a0" stroke-width="2.5"/>
  <text x="540" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="#1a8870">EOE-W55RP20_BACnet</text>
  <rect x="414" y="212" width="252" height="24" rx="6" fill="#e9f9f5" stroke="#25c2a0" stroke-width="1.5"/>
  <text x="540" y="229" text-anchor="middle" font-size="13" font-weight="600" fill="#1a8870">BACnet stack</text>
  <rect x="414" y="240" width="252" height="24" rx="6" fill="#e9f9f5" stroke="#25c2a0" stroke-width="1.5"/>
  <text x="540" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#1a8870">TLS 1.3 · certificates</text>
  <rect x="414" y="268" width="252" height="24" rx="6" fill="#25c2a0"/>
  <text x="540" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">TCP/IP in W5500 hardware</text>
  <rect x="414" y="296" width="252" height="24" rx="6" fill="#1a8870"/>
  <text x="540" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Ethernet</text>
</svg>
