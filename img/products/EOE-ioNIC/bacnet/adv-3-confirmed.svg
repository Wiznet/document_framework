<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Writes the host decides: a workstation writes 90 to AO 1, the module asks the host with +BACWRITE, the host approves with AT+BWRACK, and only then does the workstation get a SimpleACK. If the host refuses, the workstation gets a BACnet error.</title>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#ffffff"/>

  <!-- Lifelines -->
  <line x1="110" y1="74" x2="110" y2="282" stroke="#cdd5dd" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="360" y1="74" x2="360" y2="282" stroke="#cdd5dd" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="610" y1="74" x2="610" y2="282" stroke="#cdd5dd" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Participants -->
  <rect x="22" y="24" width="176" height="50" rx="10" fill="#f6f8fa" stroke="#cdd5dd" stroke-width="1.5"/>
  <text x="110" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Workstation</text>
  <rect x="272" y="24" width="176" height="50" rx="10" fill="#e9f9f5" stroke="#25c2a0" stroke-width="2"/>
  <text x="360" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1a8870">Module</text>
  <rect x="522" y="24" width="176" height="50" rx="10" fill="#f6f8fa" stroke="#cdd5dd" stroke-width="1.5"/>
  <text x="610" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2933">Host MCU</text>

  <!-- 1. The write arrives -->
  <line x1="124" y1="114" x2="346" y2="114" stroke="#52606d" stroke-width="2" marker-end="url(#a4)"/>
  <text x="235" y="104" text-anchor="middle" font-weight="600" font-size="14" fill="#1f2933">WriteProperty  AO 1 = 90</text>
  <circle cx="110" cy="114" r="11" fill="#25c2a0"/>
  <text x="110" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>

  <!-- 2. The module asks the host -->
  <line x1="374" y1="160" x2="596" y2="160" stroke="#52606d" stroke-width="2" marker-end="url(#a4)"/>
  <text x="485" y="150" text-anchor="middle" font-weight="600" font-size="13" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#1f2933">+BACWRITE:5,AO,1,16,90</text>
  <circle cx="360" cy="160" r="11" fill="#25c2a0"/>
  <text x="360" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>

  <!-- 3. The host approves -->
  <line x1="596" y1="206" x2="374" y2="206" stroke="#52606d" stroke-width="2" marker-end="url(#a4)"/>
  <text x="485" y="196" text-anchor="middle" font-weight="600" font-size="13" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#1f2933">AT+BWRACK=5,OK</text>
  <text x="485" y="226" text-anchor="middle" font-size="13" fill="#52606d">within 750 ms</text>
  <circle cx="610" cy="206" r="11" fill="#25c2a0"/>
  <text x="610" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>

  <!-- 4. Only now is the write applied -->
  <line x1="346" y1="252" x2="124" y2="252" stroke="#52606d" stroke-width="2" marker-end="url(#a4)"/>
  <text x="235" y="242" text-anchor="middle" font-weight="600" font-size="14" fill="#1f2933">SimpleACK — value applied</text>
  <circle cx="360" cy="252" r="11" fill="#25c2a0"/>
  <text x="360" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>

  <!-- If the host refuses -->
  <rect x="40" y="292" width="310" height="42" rx="21" fill="#e9f9f5" stroke="#25c2a0" stroke-width="1.5"/>
  <circle cx="66" cy="313" r="12" fill="#25c2a0"/>
  <path d="M60 313l4 4l8-9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="318" font-size="14" font-weight="700" fill="#1a8870">Host approves → value applied</text>
  <rect x="370" y="292" width="310" height="42" rx="21" fill="#fdecec" stroke="#e5484d" stroke-width="1.5"/>
  <circle cx="396" cy="313" r="12" fill="#e5484d"/>
  <path d="M391 308l10 10M401 308l-10 10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="418" y="318" font-size="14" font-weight="700" fill="#b42318">Host refuses → BACnet error</text>
</svg>
